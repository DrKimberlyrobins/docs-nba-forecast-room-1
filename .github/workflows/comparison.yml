name: Refresh player engine comparison
on:
  workflow_dispatch:
    inputs:
      import_json:
        description: 'Optional authorized comparison export JSON (imports/quotes; server timestamps receipt)'
        required: false
        default: ''
  schedule:
    - cron: '12 * * * *'
  push:
    paths: ['comparison-*.js', 'scripts/*comparison*', 'scripts/collect_nba_statistics.py', 'scripts/collect_player_logs.py', 'tests/**', '.github/workflows/comparison.yml']
permissions:
  contents: write
concurrency:
  group: forecast-archive-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Sync existing DOC forecasts without changing the model
        run: python scripts/sync_archive.py
      - run: python scripts/build_comparison.py
      - run: python scripts/collect_nba_statistics.py
      - run: python scripts/collect_player_logs.py
      - run: node scripts/comparison_ledger.cjs
        env:
          COMPARISON_IMPORT_JSON: ${{ inputs.import_json }}
      - run: |
          git config user.name 'Forecast Comparison Sync'
          git config user.email 'forecast-sync@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m 'Refresh sourced player comparison and append pregame receipts'
          git pull --rebase origin main
          git push
